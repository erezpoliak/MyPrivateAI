<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MyPrivateAI</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #111214; color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: drag;
  }
  .wrap { width: 420px; text-align: center; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .status { font-size: 12px; color: #9a9aa2; min-height: 16px; margin-bottom: 14px; }
  .status.error { color: #ff6b6b; }
  .bar { height: 3px; width: 100%; background: #2a2b2f; border-radius: 2px; overflow: hidden; }
  .bar > div {
    height: 100%; width: 40%; background: #7c6cf0; border-radius: 2px;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .log {
    margin-top: 14px; height: 90px; overflow-y: auto;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 10px;
    color: #5a5a63; text-align: left; white-space: pre-wrap;
    -webkit-app-region: no-drag;
  }
  .retry {
    display: none; margin-top: 14px; -webkit-app-region: no-drag;
    background: #7c6cf0; color: white; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>MyPrivateAI</h1>
    <div class="status" id="status">Starting…</div>
    <div class="bar" id="bar"><div></div></div>
    <button class="retry" id="retry">Quit</button>
    <div class="log" id="log"></div>
  </div>
<script>
  const statusEl = document.getElementById("status");
  const barEl = document.getElementById("bar");
  const logEl = document.getElementById("log");
  const retryEl = document.getElementById("retry");

  window.splash.onStatus((text) => {
    statusEl.textContent = text;
    statusEl.classList.remove("error");
  });

  window.splash.onLog((line) => {
    logEl.textContent += line + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  });

  window.splash.onFatal((message) => {
    statusEl.textContent = message;
    statusEl.classList.add("error");
    barEl.style.display = "none";
    retryEl.style.display = "inline-block";
  });

  retryEl.addEventListener("click", () => window.splash.quit());
</script>
</body>
</html>
